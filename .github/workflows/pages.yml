name: Publish portfolios
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: arts-react/package-lock.json
      - run: npm ci --prefix arts-react --no-fund --no-audit
      - run: npm run build --prefix arts-react
      - name: Stage both portfolios
        run: |
          mkdir -p _site
          cp index.html style.css app.js project-data.js enhancements.css _site/
          cp -R assets arts _site/
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
